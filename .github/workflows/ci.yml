name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync ruff check src tests scripts task_1_modelling task_2_deployment
      - run: uv run --no-sync ruff format --check src tests scripts task_1_modelling task_2_deployment
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python scripts/docker_smoke.py
