[project]
name = "moneyme-sms-spam-classifier"
version = "0.1.0"
description = "Reproducible SMS classification benchmark and inference API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2",
  "scikit-learn>=1.7,<2", "joblib>=1.4,<2",
  "xgboost-cpu>=3,<4; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "xgboost>=3,<4; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "python-dotenv>=1,<2", "pyyaml>=6,<7",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<1",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "ipykernel>=6,<8",
    "sentence-transformers>=5,<6",
    "transformers>=4.50,<5",
    "torch>=2.6,<3",
    "umap-learn>=0.5,<1",
    "optuna>=4,<5",
    "accelerate>=1,<2",
    "imbalanced-learn>=0.14,<0.15",
]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "imbalanced-learn>=0.14,<0.15"]

[project.scripts]
sms-spam = "moneyme_sms_spam_classifier.cli:main"
moneyme-sms-spam-classifier = "moneyme_sms_spam_classifier.cli:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
